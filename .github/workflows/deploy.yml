name: CD - Deploy to Cloud VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build frontend & Deploy to Alibaba Cloud ECS
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml

      - name: Build frontend (fresh build on every deploy)
        working-directory: web/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          echo "--- Built artifacts in web/static ---"
          ls -la ../static ../static/assets

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::Secret SERVER_SSH_KEY is empty. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir -p ~/.ssh

          python3 - << 'PYEOF'
          import os, base64, sys

          raw = os.environ.get("SSH_PRIVATE_KEY", "").strip()
          if not raw:
              sys.exit("Empty key")

          # If it was base64 encoded
          if not raw.startswith("-----"):
              try:
                  raw = base64.b64decode(raw).decode("utf-8")
              except Exception:
                  pass

          # Normalize newlines to pure Unix LF and ensure trailing newline
          lines = [line.strip() for line in raw.replace("\r\n", "\n").replace("\r", "\n").split("\n") if line.strip()]
          clean_key = "\n".join(lines) + "\n"

          with open(os.path.expanduser("~/.ssh/deploy_key"), "w", newline="\n") as f:
              f.write(clean_key)
          PYEOF

          chmod 600 ~/.ssh/deploy_key

          # Verify key format
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null || (echo "Key format error" && exit 1)

      - name: Sync backend code on server (git)
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e
            echo "🚀 Starting continuous deployment on production host..."
            cd ~/QuantVibe
            git fetch origin main
            git reset --hard origin/main
            echo "📌 Deployed commit: $(git log --oneline -1)"
          EOF

      - name: Upload freshly built frontend (atomic swap)
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
        run: |
          tar -czf - -C web/static . | ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" '
            set -e
            cd ~/QuantVibe/web
            rm -rf static.new static.old
            mkdir -p static.new
            tar -xzf - -C static.new
            test -f static.new/index.html
            mv static static.old
            mv static.new static
            rm -rf static.old
            echo "🎨 Frontend synced from CI build:"
            ls -la static static/assets
          '

      - name: Restart service & healthcheck
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e
            cd ~/QuantVibe
            source venv/bin/activate
            pip install -r requirements-web.txt --quiet
            python scripts/run_pipeline.py --force-demo || true
            pkill -f "python scripts/start_web.py" || true
            nohup python scripts/start_web.py --port 80 > web.log 2>&1 &
            sleep 3
            curl -f http://localhost/api/status || (echo "❌ Healthcheck failed" && exit 1)
            iptables -t nat -A PREROUTING -p tcp --dport 8000 -j REDIRECT --to-port 80 2>/dev/null || true
            echo "✅ Deployment completed successfully! Live on https://quantvibeapp.com"
          EOF
