name: Production Sentinel & Telemetry

on:
  schedule:
    # Probe every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  healthcheck:
    name: Probe Production Telemetry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Production Sentinel
        run: |
          python scripts/sentinel.py
