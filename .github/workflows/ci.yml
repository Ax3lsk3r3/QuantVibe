name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias mínimas
        run: pip install pandas numpy coverage
      - name: Compilar todos los módulos (chequeo de sintaxis)
        run: python -m compileall -q bridge qlib_side vibe_side scripts tests
      - name: Tests unitarios con cobertura
        run: |
          coverage run --include="*/bridge/signal_store.py,*/bridge/track_record.py,*/qlib_side/evaluate.py" -m unittest discover -s tests -v
          coverage report -m
          coverage xml
      - name: Subir cobertura a Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
