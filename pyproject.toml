[tool.ruff]
line-length = 110
extend-exclude = ["vendor", "venvs", "data", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Launchers bootstrap sys.path before importing project/uvicorn modules
"web/api.py" = ["E402"]
"web/server.py" = ["E402"]
"scripts/start_web.py" = ["E402"]

[tool.coverage.run]
branch = true
